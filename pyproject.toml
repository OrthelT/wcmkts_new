[project]
name = "wcmkts-production"
version = "0.6.8"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28.1",
    "millify>=0.1.1",
    "pandas>=2.2.0",
    "plotly>=6.0.0",
    "python-dotenv>=1.0.1",
    "pyturso>=0.7.2",
    "pytz>=2024.1",
    "requests>=2.31.0",
    # sqlalchemy floor 2.0.42 is declared by the first-party pyturso SQLAlchemy dialect;
    # dialect's package metadata under-declares its floor as >=2.0
    "sqlalchemy>=2.0.42",
    "streamlit>=1.52.2",
    "tzdata>=2025.2",
]

[project.scripts]
mkts = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["cli.py"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=5.0.0",
]
